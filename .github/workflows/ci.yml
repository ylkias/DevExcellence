name: DevExcellence CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Node ${{ matrix.node }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate JavaScript syntax
        run: |
          node --check cli/bin/devexcellence.js
          node --check cli/src/check.js
          node --check cli/src/test-audit.js
          node --check cli/src/production-audit.js
          node --check cli/src/context-plan.js
          node --check cli/src/score.js
          node --check scripts/validate-skill-package.mjs
      - name: Run CLI unit tests
        working-directory: cli
        run: npm test
      - name: Validate installable Agent Skill package
        run: node scripts/validate-skill-package.mjs
      - name: CLI smoke test
        run: node cli/bin/devexcellence.js check --fail-on never --no-secrets --json
      - name: Context plan smoke test
        run: node cli/bin/devexcellence.js context-plan --file src/api/orders.ts --json
      - name: Verify production artifact release gate
        shell: bash
        run: |
          artifact="$(mktemp -d)"
          trap 'rm -rf "$artifact"' EXIT
          printf '%s\n' 'console.log("ready")' > "$artifact/server.js"
          node cli/bin/devexcellence.js production-audit --path "$artifact" --json
          mkdir -p "$artifact/tests"
          printf '%s\n' 'test("should not ship", () => {})' > "$artifact/tests/example.test.js"
          set +e
          node cli/bin/devexcellence.js production-audit --path "$artifact" --json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Production audit should block test files (expected exit 1, got $status)"
            exit 1
          fi